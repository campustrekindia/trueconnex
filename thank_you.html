<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueConnex | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                    },
                    colors: {
                        brand: {
                            base: '#FFF0F5',
                            glass: 'rgba(255, 255, 255, 0.4)',
                            primary: '#E11D48',
                            secondary: '#DB2777',
                            accent: '#F472B6',
                            text: '#881337',
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'glow': '0 0 20px rgba(225, 29, 72, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fce7f3 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(225, 29, 72, 0.05);
        }
    </style>
</head>
<body class="font-sans text-brand-text flex items-center justify-center min-h-screen p-4">

    <div class="glass-panel rounded-[2.5rem] p-8 md:p-12 shadow-2xl border-white/80 max-w-2xl w-full text-center relative overflow-hidden">
        <!-- Confetti/Decor -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-rose-400 via-pink-500 to-rose-400"></div>
        
        <div class="mb-8">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fa-solid fa-check text-4xl text-green-500"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-serif text-rose-950 mb-2">Welcome to TrueConnex</h1>
            <p class="text-rose-600 font-medium">Payment Successful • Waitlist Confirmed</p>
        </div>

        <div class="bg-white/40 rounded-2xl p-8 mb-8 backdrop-blur-sm border border-rose-100 text-left">
            <h3 class="text-xs font-bold text-rose-500 uppercase tracking-widest mb-4 border-b border-rose-200 pb-2">Registration Details</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-[10px] text-rose-400 uppercase">Name</label>
                    <div class="text-lg font-serif font-bold text-rose-900" id="userName">Loading...</div>
                </div>
                <div>
                    <label class="block text-[10px] text-rose-400 uppercase">Mobile Linked</label>
                    <div class="text-lg font-serif font-bold text-rose-900" id="userPhone">Loading...</div>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-[10px] text-rose-400 uppercase">Your Member Access Code</label>
                    <div class="flex items-center gap-3 mt-1">
                        <div class="text-3xl font-mono font-bold text-rose-600 tracking-wider" id="userCode">...</div>
                        <button onclick="copyCode()" class="text-xs bg-rose-200 hover:bg-rose-300 text-rose-800 px-2 py-1 rounded transition-colors" title="Copy Code">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                    <p class="text-xs text-rose-500 mt-2 italic">
                        <i class="fa-solid fa-info-circle"></i> Use this code along with your mobile number to unlock event details.
                    </p>
                </div>
            </div>
        </div>

        <a href="events.html" class="inline-block w-full md:w-auto px-8 py-4 rounded-xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-bold shadow-lg shadow-pink-500/30 hover:shadow-pink-500/50 hover:-translate-y-1 transition-all">
            Browse Locked Events
        </a>
    </div>

    <script>
        // Retrieve data from LocalStorage
        const userData = JSON.parse(localStorage.getItem('trueconnexUser'));

        if (userData) {
            document.getElementById('userName').textContent = `${userData.firstName} ${userData.lastName}`;
            document.getElementById('userPhone').textContent = userData.phone;
            document.getElementById('userCode').textContent = userData.code;
        } else {
            // Fallback if accessed directly without registration
            document.getElementById('userName').textContent = "Guest";
            document.getElementById('userPhone').textContent = "--";
            document.getElementById('userCode').textContent = "NO-CODE";
            // Optional: Redirect back if no data found
            // window.location.href = 'membership.html';
        }

        function copyCode() {
            const code = document.getElementById('userCode').textContent;
            navigator.clipboard.writeText(code);
            alert("Code copied to clipboard!");
        }
    </script>
</body>
</html>
