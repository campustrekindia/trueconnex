<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueConnex | Secure Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                    },
                    colors: {
                        brand: {
                            base: '#FFF0F5',
                            glass: 'rgba(255, 255, 255, 0.4)',
                            primary: '#E11D48',
                            secondary: '#DB2777',
                            accent: '#F472B6',
                            text: '#881337',
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'glow': '0 0 20px rgba(225, 29, 72, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fce7f3 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(225, 29, 72, 0.05);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #E11D48;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Selected state for payment options */
        .payment-option {
            transition: all 0.2s ease;
        }
        .payment-option.selected {
            border-color: #E11D48;
            background-color: rgba(255, 241, 242, 0.5);
            box-shadow: 0 2px 4px rgba(225, 29, 72, 0.1);
        }
        .payment-option.selected .check-circle {
            background-color: #E11D48;
            border-color: #E11D48;
        }
        .payment-option.selected .check-icon {
            opacity: 1;
        }
    </style>
</head>
<body class="font-sans text-brand-text flex items-center justify-center min-h-screen p-4">

    <div class="glass-panel rounded-2xl w-full max-w-md overflow-hidden relative shadow-2xl">
        <!-- Header -->
        <div class="bg-gray-50 border-b border-gray-100 p-6 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-rose-500 rounded text-white flex items-center justify-center font-bold font-serif">T</div>
                <span class="font-bold text-gray-700">TrueConnex</span>
            </div>
            <div class="text-xs text-gray-400 font-medium">
                <i class="fa-solid fa-lock text-green-500 mr-1"></i> SECURE
            </div>
        </div>

        <!-- Body -->
        <div class="p-8">
            <div class="text-center mb-8">
                <p class="text-gray-500 text-sm uppercase tracking-wide mb-1">Total Payable</p>
                <h1 class="text-4xl font-bold text-gray-800">₹2,499.00</h1>
                <div class="mt-2 inline-flex items-center gap-2 bg-rose-50 text-rose-600 px-3 py-1 rounded-full text-xs font-medium">
                    Lifetime Membership Access
                </div>
            </div>

            <div class="space-y-4">
                <div class="payment-option border border-gray-200 rounded-xl p-4 flex items-center justify-between cursor-pointer hover:border-rose-500 hover:bg-rose-50/30 group" onclick="selectPayment(this)">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-white border border-gray-100 rounded-full flex items-center justify-center text-blue-600">
                            <i class="fa-brands fa-google-pay text-xl"></i>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800 text-sm">UPI / GPay / PhonePe</div>
                            <div class="text-xs text-gray-400">Instant Payment</div>
                        </div>
                    </div>
                    <div class="check-circle w-5 h-5 rounded-full border border-gray-300 group-hover:border-rose-500 flex items-center justify-center transition-colors">
                         <i class="check-icon fa-solid fa-check text-white text-[10px] opacity-0 transition-opacity"></i>
                    </div>
                </div>

                <div class="payment-option border border-gray-200 rounded-xl p-4 flex items-center justify-between cursor-pointer hover:border-rose-500 hover:bg-rose-50/30 group" onclick="selectPayment(this)">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-600">
                            <i class="fa-regular fa-credit-card text-lg"></i>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800 text-sm">Card</div>
                            <div class="text-xs text-gray-400">Visa, Mastercard, RuPay</div>
                        </div>
                    </div>
                    <div class="check-circle w-5 h-5 rounded-full border border-gray-300 group-hover:border-rose-500 flex items-center justify-center transition-colors">
                         <i class="check-icon fa-solid fa-check text-white text-[10px] opacity-0 transition-opacity"></i>
                    </div>
                </div>
            </div>

            <button onclick="processPayment()" id="payBtn" class="w-full mt-8 bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-rose-500/30 flex items-center justify-center gap-2">
                <span>Join the Club</span>
            </button>
            
            <p class="text-center text-[10px] text-gray-400 mt-4">
                By paying, you agree to the Terms of Service.
            </p>
        </div>
    </div>

    <script>
        let selectedPayment = false;

        function selectPayment(element) {
            // Remove selected class from all options
            document.querySelectorAll('.payment-option').forEach(el => {
                el.classList.remove('selected');
            });
            // Add to clicked
            element.classList.add('selected');
            selectedPayment = true;
        }

        function processPayment() {
            if (!selectedPayment) {
                alert("Please select a payment method.");
                return;
            }

            const btn = document.getElementById('payBtn');
            
            // Animation start
            btn.innerHTML = '<div class="loader"></div> Processing...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // 1. Simulate Processing
            setTimeout(() => {
                // 2. Change to "Added"
                btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Added';
                btn.classList.remove('bg-rose-600', 'hover:bg-rose-700');
                btn.classList.add('bg-green-600');
                
                // 3. Redirect to Razorpay
                setTimeout(() => {
                    // Replace this with your actual Razorpay Payment Link
                    window.location.href = 'https://razorpay.com/payment-link-placeholder'; 
                }, 1500);
            }, 2000);
        }
    </script>
</body>
</html>
